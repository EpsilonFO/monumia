version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patrialta-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: patrialta-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
