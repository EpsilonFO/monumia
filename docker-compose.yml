services:
  # ── Backends ──────────────────────────────────────────
  app-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patrialta-app-backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    restart: unless-stopped

  beta-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patrialta-beta-backend
    env_file:
      - ./backend/.env.beta
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # ── Frontend builds ──────────────────────────────────
  landing-build:
    build:
      context: ./landing
      dockerfile: Dockerfile
      args:
        VITE_APP_URL: https://app.patrialta.fr
    container_name: patrialta-landing-build
    volumes:
      - landing_dist:/dist

  app-frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://app.patrialta.fr/api
        VITE_SUPABASE_URL: ${APP_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${APP_SUPABASE_ANON_KEY}
    container_name: patrialta-app-frontend-build
    volumes:
      - app_frontend_dist:/dist

  beta-frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://beta.patrialta.fr/api
        VITE_SUPABASE_URL: ${BETA_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${BETA_SUPABASE_ANON_KEY}
    container_name: patrialta-beta-frontend-build
    volumes:
      - beta_frontend_dist:/dist

  # ── Nginx (single entry point) ──────────────────────
  nginx:
    image: nginx:alpine
    container_name: patrialta-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - landing_dist:/usr/share/nginx/landing:ro
      - app_frontend_dist:/usr/share/nginx/app:ro
      - beta_frontend_dist:/usr/share/nginx/beta:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - app-backend
      - beta-backend
      - landing-build
      - app-frontend-build
      - beta-frontend-build
    restart: unless-stopped

  # ── SSL ─────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: patrialta-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  landing_dist:
  app_frontend_dist:
  beta_frontend_dist:
  certbot_www:
  certbot_conf:
