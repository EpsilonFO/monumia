# Project name pinned to "patrys": the existing volumes on the VPS
# (incl. certbot_conf which holds the Let's Encrypt certificates) are
# prefixed patrys_*. Renaming the project would orphan them.
name: patrys

services:
  # ── Backends ──────────────────────────────────────────
  app-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: monumia-app-backend
    container_name: monumia-app-backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    restart: unless-stopped

  beta-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: monumia-beta-backend
    container_name: monumia-beta-backend
    env_file:
      - ./backend/.env.beta
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # ── Frontend builds ──────────────────────────────────
  # Ces services ne sont JAMAIS démarrés : ils ne servent qu'à construire les
  # images (`docker compose build`). deploy.sh extrait ensuite /dist de l'image
  # vers /srv/monumia/<cible>/releases/<sha> et bascule un lien symbolique.
  #
  # Ils montaient auparavant un volume nommé sur /dist, ce qui obligeait à
  # supprimer le volume à chaque déploiement (Docker n'initialise un volume
  # nommé que s'il est vide), donc à arrêter nginx. Voir scripts/lib-release.sh.
  landing-build:
    build:
      context: ./landing
      dockerfile: Dockerfile
      args:
        VITE_APP_URL: https://app.monumia.fr
        VITE_API_URL: https://app.monumia.fr/api
    image: monumia-landing-build
    container_name: monumia-landing-build

  app-frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://app.monumia.fr/api
        VITE_SUPABASE_URL: ${APP_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${APP_SUPABASE_ANON_KEY}
        VITE_YBUG_ID: ${APP_YBUG_ID:-}
    image: monumia-app-frontend-build
    container_name: monumia-app-frontend-build

  beta-frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://beta.monumia.fr/api
        VITE_SUPABASE_URL: ${BETA_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${BETA_SUPABASE_ANON_KEY}
        VITE_YBUG_ID: ${BETA_YBUG_ID:-}
    image: monumia-beta-frontend-build
    container_name: monumia-beta-frontend-build

  # Landing servie sous beta.monumia.fr/landing — preview avant la prod.
  # Buildée avec base=/landing/ pour que les assets résolvent sous ce chemin.
  landing-beta-build:
    build:
      context: ./landing
      dockerfile: Dockerfile
      args:
        VITE_BASE: /landing/
        VITE_APP_URL: https://beta.monumia.fr
        VITE_API_URL: https://beta.monumia.fr/api
    image: monumia-landing-beta-build
    container_name: monumia-landing-beta-build

  # ── Nginx (single entry point) ──────────────────────
  nginx:
    image: nginx:alpine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: monumia-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Répertoires de releases sur l'hôte, remplis par deploy.sh. nginx sert
      # <cible>/current, un lien symbolique relatif vers releases/<sha>. Monter
      # la racine (et pas `current` directement) est indispensable : le lien doit
      # pouvoir se résoudre à l'intérieur du conteneur, et une bascule côté hôte
      # doit être visible sans recréer le conteneur.
      - /srv/monumia/landing:/usr/share/nginx/landing:ro
      - /srv/monumia/app:/usr/share/nginx/app:ro
      - /srv/monumia/beta:/usr/share/nginx/beta:ro
      - /srv/monumia/landing-beta:/usr/share/nginx/landing-beta:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - app-backend
      - beta-backend
    networks:
      - default
      - web
    # Recharge nginx toutes les 12 h. Le service certbot renouvelle les fichiers
    # de certificat sur le disque, mais nginx garde en mémoire ceux qu'il a lus
    # au démarrage : sans reload, il continue de servir l'ancien certificat
    # jusqu'à son expiration, et seul un déploiement venait le rafraîchir.
    # `exec` laisse nginx en PID 1 pour qu'il reçoive le SIGTERM de `stop`.
    command: "/bin/sh -c 'while :; do sleep 12h & wait $${!}; nginx -s reload; done & exec nginx -g \"daemon off;\"'"
    restart: unless-stopped

  # ── SSL ─────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: monumia-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    # Sans cette ligne, la boucle de renouvellement ne survit pas à un reboot du
    # VPS : c'est ce qui est arrivé le 2026-07-08 (conteneur mort, code 255),
    # et les certificats ont expiré le 2026-09-08 sans que rien ne le signale.
    # Le conteneur n'a pas été relancé après ce correctif : un certificat a
    # expiré le 2026-10-12. deploy.sh fait donc aussi `up -d certbot`.
    restart: unless-stopped

volumes:
  # Les anciens volumes de dist (patrys_landing_dist, patrys_app_frontend_dist,
  # patrys_beta_frontend_dist, patrys_landing_beta_dist) ne sont plus référencés,
  # le statique vit sous /srv/monumia. Ils subsistent sur le VPS et peuvent être
  # supprimés une fois le nouveau déploiement validé.
  certbot_www:
  certbot_conf:

networks:
    default:
    web:
      external: true
