# Project name pinned to "patrys": the existing volumes on the VPS
# (incl. certbot_conf which holds the Let's Encrypt certificates) are
# prefixed patrys_*. Renaming the project would orphan them.
name: patrys

services:
  # ── Backends ──────────────────────────────────────────
  app-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: monumia-app-backend
    container_name: monumia-app-backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    restart: unless-stopped

  beta-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: monumia-beta-backend
    container_name: monumia-beta-backend
    env_file:
      - ./backend/.env.beta
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # ── Frontend builds ──────────────────────────────────
  landing-build:
    build:
      context: ./landing
      dockerfile: Dockerfile
      args:
        VITE_APP_URL: https://app.monumia.fr
        VITE_API_URL: https://app.monumia.fr/api
    image: monumia-landing-build
    container_name: monumia-landing-build
    volumes:
      - landing_dist:/dist

  app-frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://app.monumia.fr/api
        VITE_SUPABASE_URL: ${APP_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${APP_SUPABASE_ANON_KEY}
    image: monumia-app-frontend-build
    container_name: monumia-app-frontend-build
    volumes:
      - app_frontend_dist:/dist

  beta-frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://beta.monumia.fr/api
        VITE_SUPABASE_URL: ${BETA_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${BETA_SUPABASE_ANON_KEY}
    image: monumia-beta-frontend-build
    container_name: monumia-beta-frontend-build
    volumes:
      - beta_frontend_dist:/dist

  # Landing servie sous beta.monumia.fr/landing — preview avant la prod.
  # Buildée avec base=/landing/ pour que les assets résolvent sous ce chemin.
  landing-beta-build:
    build:
      context: ./landing
      dockerfile: Dockerfile
      args:
        VITE_BASE: /landing/
        VITE_APP_URL: https://beta.monumia.fr
        VITE_API_URL: https://beta.monumia.fr/api
    image: monumia-landing-beta-build
    container_name: monumia-landing-beta-build
    volumes:
      - landing_beta_dist:/dist

  # ── Nginx (single entry point) ──────────────────────
  nginx:
    image: nginx:alpine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: monumia-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - landing_dist:/usr/share/nginx/landing:ro
      - app_frontend_dist:/usr/share/nginx/app:ro
      - beta_frontend_dist:/usr/share/nginx/beta:ro
      - landing_beta_dist:/usr/share/nginx/landing-beta:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - app-backend
      - beta-backend
      - landing-build
      - app-frontend-build
      - beta-frontend-build
      - landing-beta-build
    networks:
      - default
      - web
    restart: unless-stopped

  # ── SSL ─────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: monumia-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  landing_dist:
  app_frontend_dist:
  beta_frontend_dist:
  landing_beta_dist:
  certbot_www:
  certbot_conf:

networks:
    default:
    web:
      external: true
