# ── HTTP → HTTPS redirect (all domains) ────────────────
server {
    listen 80;
    listen [::]:80;
    server_name monumia.fr www.monumia.fr app.monumia.fr beta.monumia.fr
                patrys.fr www.patrys.fr app.patrys.fr beta.patrys.fr
                patrialta.fr www.patrialta.fr app.patrialta.fr beta.patrialta.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Compression (contexte http : ce fichier est inclus dans `http {}`) ──
# Rien n'était compressé : le bundle JS de l'app fait 1,5 Mo et le catalogue
# d'aides 1,1 Mo de JSON. `gzip_proxied any` est indispensable pour que les
# réponses venant des backends soient compressées elles aussi.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types application/json application/javascript text/javascript text/css
           text/plain image/svg+xml application/manifest+json;

# ── Journalisation avec durées (contexte http) ──────────
# Le format `combined` de l'image nginx ne journalise PAS la durée des requêtes,
# ce qui rend impossible tout calcul de capacité : sans durée moyenne, on ne sait
# pas si 40 requêtes en vol représentent 20 ou 200 requêtes par seconde.
#
# JSON avec `escape=json` pour que Loki/Grafana et `jq` le lisent sans parsing
# fragile. Deux durées distinctes, et c'est le point important :
#   request_time  temps total vu par le client, TLS et transfert inclus
#   upstream_time temps passé par le backend seul (vide sur les fichiers statiques)
# L'écart entre les deux sépare un backend lent d'un réseau client lent.
log_format monumia_json escape=json
    '{'
      '"time":"$time_iso8601",'
      '"host":"$host",'
      '"method":"$request_method",'
      '"uri":"$uri",'
      '"status":$status,'
      '"request_time":$request_time,'
      '"upstream_time":"$upstream_response_time",'
      '"bytes":$body_bytes_sent,'
      '"ip":"$remote_addr",'
      '"ua":"$http_user_agent"'
    '}';

# ── Websockets (contexte http) ──────────────────────────
# `Connection` est un en-tête hop-by-hop : le relayer tel quel casserait le
# keepalive vers les upstreams. Cette map ne renvoie `upgrade` que lorsque le
# client demande vraiment une bascule websocket, et `close` sinon.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── monumia.fr — Landing page ────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monumia.fr www.monumia.fr;

    ssl_certificate /etc/letsencrypt/live/monumia.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monumia.fr/privkey.pem;

    # `current` est un lien symbolique vers releases/<sha>, basculé atomiquement
    # par deploy.sh. nginx le résout à chaque requête : une bascule est prise en
    # compte immédiatement, sans redémarrage. Voir scripts/lib-release.sh.
    location / {
        root /usr/share/nginx/landing/current;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Ancienne page de liste d'attente, supprimée : les liens déjà partagés
    # retombent sur l'accueil, et le 301 la fait sortir de l'index.
    location ~ ^/lancement/?$ {
        return 301 /;
    }

    # Fichiers buildés par Vite sous /assets/ : noms hashés par contenu, donc
    # jamais réutilisés pour un contenu différent -> cache long + immutable.
    # Un seul en-tête : `expires` émet son propre Cache-Control, le combiner
    # avec `add_header` en produirait deux et un proxy ne lirait que le premier.
    # Pas de `always` ici : il ferait porter le cache d'un an aux 404 servis
    # pendant une bascule de release, que le navigateur garderait un an.
    location /assets/ {
        root /usr/share/nginx/landing/current;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html référence les assets hashés du jour : jamais de cache long,
    # sinon un déploiement resterait invisible pour les visiteurs qui l'ont
    # en cache. Atteint aussi pour `/` et les routes SPA : la redirection
    # interne de `index`/`try_files` rejoue la sélection de location.
    location = /index.html {
        root /usr/share/nginx/landing/current;
        add_header Cache-Control "no-cache" always;
    }
}

# ── app.monumia.fr — Production app ─────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2 : le dashboard tire une dizaine de requêtes en parallèle, plafonnées
    # à 6 connexions simultanées en HTTP/1.1.
    http2 on;
    server_name app.monumia.fr;

    ssl_certificate /etc/letsencrypt/live/app.monumia.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.monumia.fr/privkey.pem;

    # Remplace le format `combined` hérité du contexte http pour ce serveur
    # uniquement (pas de double journalisation).
    access_log /var/log/nginx/access.log monumia_json;

    location / {
        root /usr/share/nginx/app/current;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Mêmes règles que sur la landing : assets hashés en cache immuable,
    # index.html jamais mis en cache pour qu'un déploiement soit vu tout de
    # suite. Voir le bloc monumia.fr pour le détail.
    location /assets/ {
        root /usr/share/nginx/app/current;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        root /usr/share/nginx/app/current;
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        proxy_pass http://app-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }
}

# ── beta.monumia.fr — Beta app ──────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name beta.monumia.fr;

    ssl_certificate /etc/letsencrypt/live/beta.monumia.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.monumia.fr/privkey.pem;

    access_log /var/log/nginx/access.log monumia_json;

    # ── Landing en preview (uniquement en beta) ──
    # /landing → /landing/ ; assets buildés avec base=/landing/
    location = /landing {
        return 301 /landing/;
    }
    location /landing/ {
        alias /usr/share/nginx/landing-beta/current/;
        try_files $uri $uri/ /landing/index.html;
    }

    # Buildée avec base=/landing/, donc ses assets hashés sont sous
    # /landing/assets/ et n'entrent pas en conflit avec ceux de l'app beta.
    location /landing/assets/ {
        alias /usr/share/nginx/landing-beta/current/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /landing/index.html {
        alias /usr/share/nginx/landing-beta/current/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        root /usr/share/nginx/beta/current;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Mêmes règles que sur la landing : assets hashés en cache immuable,
    # index.html jamais mis en cache pour qu'un déploiement soit vu tout de
    # suite. Voir le bloc monumia.fr pour le détail.
    location /assets/ {
        root /usr/share/nginx/beta/current;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        root /usr/share/nginx/beta/current;
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        proxy_pass http://beta-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }
}

# ════════════════════════════════════════════════════════
# patrys.fr → monumia.fr — redirections 301
# Le domaine patrys.fr est résilié : ces blocs cesseront
# de servir quand le domaine expirera. À supprimer ensuite.
# ════════════════════════════════════════════════════════

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name patrys.fr www.patrys.fr;

    ssl_certificate /etc/letsencrypt/live/patrys.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patrys.fr/privkey.pem;

    return 301 https://monumia.fr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.patrys.fr;

    ssl_certificate /etc/letsencrypt/live/app.patrys.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.patrys.fr/privkey.pem;

    return 301 https://app.monumia.fr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name beta.patrys.fr;

    ssl_certificate /etc/letsencrypt/live/beta.patrys.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.patrys.fr/privkey.pem;

    return 301 https://beta.monumia.fr$request_uri;
}

# ════════════════════════════════════════════════════════
# patrialta.fr → monumia.fr — redirections 301
# Ancien nom du projet. Le domaine est résilié (effet le
# 07/10/2027, sa zone DNS le 22/03/2027) : ces blocs
# cesseront de servir à ce moment-là. À supprimer ensuite.
# Sans eux, patrialta.fr retombe sur le premier bloc 443
# et présente le certificat monumia.fr, ce que les
# navigateurs signalent comme une usurpation de site.
# ════════════════════════════════════════════════════════

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name patrialta.fr www.patrialta.fr;

    ssl_certificate /etc/letsencrypt/live/patrialta.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patrialta.fr/privkey.pem;

    return 301 https://monumia.fr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.patrialta.fr;

    ssl_certificate /etc/letsencrypt/live/app.patrialta.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.patrialta.fr/privkey.pem;

    return 301 https://app.monumia.fr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name beta.patrialta.fr;

    ssl_certificate /etc/letsencrypt/live/beta.patrialta.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.patrialta.fr/privkey.pem;

    return 301 https://beta.monumia.fr$request_uri;
}
