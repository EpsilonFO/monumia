# ── HTTP → HTTPS redirect (all domains) ────────────────
server {
    listen 80;
    listen [::]:80;
    server_name patrys.fr www.patrys.fr app.patrys.fr beta.patrys.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── patrys.fr — Landing page ────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name patrys.fr www.patrys.fr;

    ssl_certificate /etc/letsencrypt/live/patrys.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patrys.fr/privkey.pem;

    location / {
        root /usr/share/nginx/landing;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# ── app.patrys.fr — Production app ─────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.patrys.fr;

    ssl_certificate /etc/letsencrypt/live/app.patrys.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.patrys.fr/privkey.pem;

    location / {
        root /usr/share/nginx/app;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://app-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }
}

# ── beta.patrys.fr — Beta app ──────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name beta.patrys.fr;

    ssl_certificate /etc/letsencrypt/live/beta.patrys.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.patrys.fr/privkey.pem;

    location / {
        root /usr/share/nginx/beta;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://beta-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }
}
