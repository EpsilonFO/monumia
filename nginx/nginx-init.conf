# Initial config — HTTP only, for Let's Encrypt certificate generation
# Replace with nginx.conf once the certificates are obtained

server {
    listen 80;
    listen [::]:80;
    server_name monumia.fr www.monumia.fr app.monumia.fr beta.monumia.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        root /usr/share/nginx/landing;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
