[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.133.1",
    "pydantic[email]>=2.12.5",
    "python-dotenv>=1.0.0",
    "supabase>=2.28.0",
    "uvicorn>=0.30.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "resend>=2.30.1",
    "pyyaml>=6.0.3",
    "html2text>=2025.4.15",
    "pyjwt>=2.10.0",
    "stripe>=12.0.0",
    "anthropic>=0.69.0",
    "brotli>=1.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pyright>=1.1.0",
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
]
# `providall` vit dans un dépôt PRIVÉ, tiré en SSH. Le déclarer dans
# [project].dependencies imposait une clé SSH à tout ce qui fait `uv sync` :
# le runner GitHub (qui n'en a pas → CI rouge) et le build Docker (qui n'en a
# pas non plus → le prochain deploy.sh aurait cassé de la même façon).
#
# Or aucun code servi par l'API ne l'importe : main.py, les routers et les
# services l'ignorent. Il ne sert qu'à `scripts/` (prospection, ingestion) et
# à leurs tests. C'est donc un outil de poste de travail, pas une dépendance
# de production — d'où un groupe NON par défaut, que ni `uv sync` (Docker) ni
# `uv sync --group dev` n'installent.
#
# En local, pour faire tourner le pipeline ou ses tests :
#     uv sync --group dev --group pipeline
# La CI fait de même, avec une clé de déploiement en lecture seule
# (secret PROVIDALL_DEPLOY_KEY, cf. .github/workflows/ci.yml).
pipeline = [
    "providall",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402"]
"scripts/*.py" = ["E402"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["*.py", "services"]
exclude = [".venv", "scripts", "routers"]

[tool.uv.sources]
providall = { git = "ssh://git@github.com/EpsilonFO/providall.git", subdirectory = "python", tag = "v0.1.0" }
