[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.133.1",
    "pydantic[email]>=2.12.5",
    "python-dotenv>=1.0.0",
    "supabase>=2.28.0",
    "uvicorn>=0.30.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "resend>=2.30.1",
    "pyyaml>=6.0.3",
    "html2text>=2025.4.15",
    "pyjwt>=2.10.0",
    "stripe>=12.0.0",
    "anthropic>=0.69.0",
    "brotli>=1.2.0",
    "providall",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pyright>=1.1.0",
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402"]
"scripts/*.py" = ["E402"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["*.py", "services"]
exclude = [".venv", "scripts", "routers"]

[tool.uv.sources]
providall = { git = "ssh://git@github.com/EpsilonFO/providall.git", subdirectory = "python", tag = "v0.1.0" }
