repos:
  # Block secret leaks at both pre-commit and pre-push.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        stages: [pre-commit, pre-push]

  - repo: local
    hooks:
      # Pre-commit: format and auto-fix before committing
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && uv run ruff format . && git add -u'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff-fix
        name: ruff lint fix
        entry: bash -c 'cd backend && uv run ruff check --fix . && git add -u'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # Pre-commit: frontend type check (same as docker build)
      - id: tsc
        name: typescript type check
        entry: bash -c 'cd frontend && npx tsc -b'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # Pre-push: check only (no modifications)
      - id: ruff-format-check
        name: ruff format check
        entry: bash -c 'cd backend && uv run ruff format --check .'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: ruff-check
        name: ruff lint check
        entry: bash -c 'cd backend && uv run ruff check .'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pyright
        name: pyright type check
        entry: bash -c 'cd backend && uv run pyright .'
        language: system
        pass_filenames: false
        stages: [pre-push]
